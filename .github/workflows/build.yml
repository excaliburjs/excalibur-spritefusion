name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

jobs:
  build:
    name: Build & type-check
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 100
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit

  e2e:
    name: Snapshot tests (chromium/linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 100
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Install snapshot rendering deps
        # xvfb gives chromium a real X display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-liberation fonts-noto-core
      - run: npx playwright install --with-deps chromium
      - name: Run snapshot tests
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
